.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}

table{border-collapse:collapse;width:100%}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}

                        <button className="btn !p-1.5 !rounded-full" aria-label={`Agregar ${e.n}`} disabled={!canMore} onClick={() => set(q + 1)}><Icon n="plus" size={14} /></button>
                      </div>
                    </div>
                  );
                })}</div>
              </div>

              <div className="card p-4 flex flex-wrap items-center gap-3 justify-between" style={{ position: 'sticky', bottom: 8 }}>
                <div className="w-full text-sm num flex flex-col gap-0.5">
                  <div className="flex justify-between"><span className="muted">Precio base ({MODES[mode].name.toLowerCase()})</span><span>{S(base)}</span></div>
                  {dc.bd.prem > 0 && <div className="flex justify-between"><span className="muted">Suplemento proteína premium</span><span>+ {S(dc.bd.prem)}</span></div>}
                  {dc.bd.porc > 0 && <div className="flex justify-between"><span className="muted">Porciones adicionales</span><span>+ {S(dc.bd.porc)}</span></div>}
                  {dc.bd.beb > 0 && <div className="flex justify-between"><span className="muted">Bebida del Día</span><span>+ {S(dc.bd.beb)}</span></div>}
                  <div className="flex justify-between font-bold pt-1" style={{ borderTop: '1px solid var(--line)' }}><span>Total por plato</span><span>{S(unit)}</span></div>
                </div>
                <div className="flex items-center gap-2"><button className="btn !p-2 !rounded-full" aria-label="Menos" onClick={() => setDish((x) => ({ ...x, qty: Math.max(1, x.qty - 1) }))}><Icon n="minus" size={14} /></button><b className="num w-5 text-center">{dish.qty}</b><button className="btn !p-2 !rounded-full" aria-label="Más" onClick={() => setDish((x) => ({ ...x, qty: Math.min(9, x.qty + 1) }))}><Icon n="plus" size={14} /></button></div>
                <button className="btn btn-p flex-1 !py-3 text-base min-w-[200px]" disabled={!!modalErr} onClick={addToCart}>Agregar al carrito · <span className="num">{S(unit * dish.qty)}</span></button>
                {modalErr && <p className="w-full text-xs font-semibold" style={{ color: 'var(--danger)' }}>{modalErr}</p>}
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  })();

  /* Desglose de precio por unidad: base + premium + porciones (+ bebida) */
  const priceLines = (it) => it.fixed != null ? null : (
    <div className="text-xs num mt-2 soft px-2.5 py-1.5 flex flex-col gap-0.5">
      <div className="flex justify-between"><span className="muted">Precio base</span><span>{S(it.base)}</span></div>
      {it.bd.prem > 0 && <div className="flex justify-between"><span className="muted">Proteína premium</span><span>+ {S(it.bd.prem)}</span></div>}
      {it.bd.porc > 0 && <div className="flex justify-between"><span className="muted">Porciones adicionales</span><span>+ {S(it.bd.porc)}</span></div>}
      {it.bd.beb > 0 && <div className="flex justify-between"><span className="muted">Bebida del Día</span><span>+ {S(it.bd.beb)}</span></div>}
      <div className="flex justify-between font-semibold"><span>Total por plato{it.qty > 1 ? ` (× ${it.qty})` : ''}</span><span>{S(unitPrice(it))}</span></div>
    </div>
  );

  /* ---- drawer ---- */
  const drawerView = drawer && (
    <div className="overlay" onClick={() => setDrawer(false)}>
      <aside role="dialog" aria-modal="true" aria-label="Carrito" className="slide absolute right-0 top-0 bottom-0 w-full flex flex-col" style={{ maxWidth: 440, background: 'var(--bg)', paddingTop: 'env(safe-area-inset-top,0px)', paddingRight: 'env(safe-area-inset-right,0px)' }} onClick={(e) => e.stopPropagation()}>
        <div className="flex justify-between items-center p-4" style={{ borderBottom: '1px solid var(--line)' }}><h2 className="display text-xl font-bold">Tu pedido <span className="muted text-base">({cartCount})</span></h2><button className="btn !p-2" onClick={() => setDrawer(false)} aria-label="Cerrar carrito"><Icon n="x" /></button></div>
        <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
          {cart.length === 0 && <div className="text-center py-16 muted"><Icon n="bag" size={40} className="mx-auto mb-3 opacity-50" /><p>Tu carrito está vacío.</p><button className="btn mt-4" onClick={() => { setDrawer(false); setView('carta'); }}>Ver la carta</button></div>}
          {cart.map((it) => (
            <div key={it.uid} className="card p-3">
              <div className="flex justify-between gap-2"><div className="min-w-0"><div className="font-bold leading-tight">{it.name}</div><div className="text-xs muted">{it.dateLabel} · {lineName(it.line)}{it.mode ? ' · ' + MODES[it.mode].name.toLowerCase() : ''}</div></div><b className="num">{S(unitPrice(it) * it.qty)}</b></div>
              {it.notes.length > 0 && <ul className="text-xs muted mt-2 flex flex-col gap-0.5">{it.notes.map((n, i) => <li key={i}>{n}</li>)}</ul>}
              {priceLines(it)}
              <div className="text-xs num mt-2 flex flex-wrap gap-x-3"><span>{r0(it.n.k)} kcal</span><span>P {r0(it.n.p)} g</span><span>C {r0(it.n.c)} g</span><span>G {r0(it.n.g)} g</span></div>
              <div className="flex justify-between items-center mt-2">
                <div className="flex items-center gap-1.5"><button className="btn !p-1.5 !rounded-full" aria-label="Menos" onClick={() => setQty(it.uid, it.qty - 1)}><Icon n="minus" size={13} /></button><b className="num w-5 text-center">{it.qty}</b><button className="btn !p-1.5 !rounded-full" aria-label="Más" onClick={() => setQty(it.uid, it.qty + 1)}><Icon n="plus" size={13} /></button></div>
                <button className="text-xs font-semibold flex items-center gap-1" style={{ color: 'var(--danger)' }} onClick={() => setQty(it.uid, 0)}><Icon n="trash" size={14} />Quitar</button>
              </div>
            </div>
          ))}
        </div>
        {cart.length > 0 && (
          <div className="p-4 flex flex-col gap-3" style={{ borderTop: '1px solid var(--line)', background: 'var(--surface)', paddingBottom: 'max(16px,env(safe-area-inset-bottom,0px))' }}>
            <div><div className="lbl mb-1">Macros totales del pedido</div><NutRow n={cartNut} /></div>
            <div className="flex justify-between items-baseline"><span className="font-semibold">Subtotal</span><span className="display text-2xl font-extrabold num">{S(cartTotal)}</span></div>
            <button className="btn btn-p !py-3 text-base" onClick={() => { setDrawer(false); setTicket(null); setView('checkout'); }}>Elegir franja y pagar <Icon n="arrow" size={16} /></button>
          </div>
        )}
      </aside>
    </div>
  );

  /* ---- checkout ---- */
  const checkout = (
    <div className="pop py-8">
      {ticket ? (
        <div>
          <div className="grid md:grid-cols-[auto_1fr] gap-6 card p-6" style={{ borderColor: 'var(--grn)' }}>
            <div className="flex flex-col items-center gap-3"><QR text={`BIENSERVIDO|${ticket.code}|${SLOTS[ticket.slot]}`} /><div className="display text-xl font-extrabold num tracking-wider">{ticket.code}</div><div className="soft px-4 py-2 text-center"><div className="lbl">PIN de recojo</div><div className="display text-2xl font-extrabold num tracking-[0.3em]">{ticket.pin}</div></div></div>
            <div className="min-w-0">
              <span className="chip chip-g"><Icon n="check" size={13} />Pase QR de recojo</span>
              <h2 className="display text-3xl font-extrabold mt-2">¡Listo, {ticket.name.split(' ')[0]}!</h2>
              <p className="muted text-sm">UTEC {ticket.ucode} · {ticket.modes.length ? ticket.modes.join(' + ') : 'Snacks y postres'}</p>
              <p className="mt-2 flex items-start gap-2"><span style={{ color: 'var(--pri)' }}><Icon n="pin" size={18} /></span><span>Presenta este QR o tu PIN en el <b>Módulo Piso 1 UTEC</b>, franja <b>{SLOTS[ticket.slot]}</b>, el <b>{[...new Set(ticket.items.map((i) => i.dateLabel))].join(', ')}</b>. Te entregamos en menos de 1 minuto.</span></p>
              {ticket.pay === 'efectivo' && <p className="chip chip-m mt-2">Pagas en efectivo en el punto. Tu plato se reserva máximo 10 minutos.</p>}
              <ul className="mt-3 text-sm flex flex-col gap-1">{ticket.items.map((i) => <li key={i.uid} className="flex justify-between gap-3"><span>{i.qty} × {i.name} <span className="muted">· {i.dateLabel}</span>{i.notes.length ? <span className="muted"> ({i.notes.join(', ')})</span> : null}</span><b className="num">{S(i.unit * i.qty)}</b></li>)}</ul>
              <div className="flex justify-between mt-3 pt-3 font-bold text-lg num" style={{ borderTop: '1px solid var(--line)' }}><span>Total {ticket.pay === 'efectivo' ? 'a pagar en punto' : 'pagado (simulado)'}</span><span>{S(ticket.total)}</span></div>
              <div className="mt-4 p-4 rounded-xl" style={{ border: '2px solid var(--fg)' }}>
                <div className="display text-lg font-extrabold">Información nutricional del pedido</div>
                <div className="flex justify-between items-end py-2 num" style={{ borderBottom: '6px solid var(--fg)' }}><span className="font-bold">Energía</span><span className="display text-3xl font-extrabold">{r0(ticket.nut.k)} kcal</span></div>
                {[['Proteína', r1(ticket.nut.p) + ' g'], ['Carbohidratos', r1(ticket.nut.c) + ' g'], ['Grasas', r1(ticket.nut.g) + ' g'], ['Fibra', r1(ticket.nut.f) + ' g']].map(([a, b]) => <div key={a} className="flex justify-between py-1.5 text-sm num" style={{ borderBottom: '1px solid var(--line)' }}><span>{a}</span><b>{b}</b></div>)}
              </div>
            </div>
          </div>
          <button className="btn btn-p mt-6" onClick={() => { setTicket(null); setSlot(null); setView('carta'); }}>Volver a la carta</button>
        </div>
      ) : (
        <div className="grid lg:grid-cols-[1fr_380px] gap-6 items-start">
          <div className="flex flex-col gap-5 min-w-0">
            <h2 className="display text-3xl font-bold">Finaliza tu pedido</h2>
            <section className="card p-5"><div className="flex justify-between flex-wrap gap-2"><h3 className="font-bold">1. Franja de recojo · Piso 1 UTEC</h3><span className="chip chip-g"><Icon n="clock" size={13} />11:00 a.m. – 6:00 p.m.</span></div>
              <p className="text-sm muted mt-1">Ventanas de 30 minutos. Sin límite de pedidos por franja: puedes recoger junto a otros estudiantes.</p>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2 mt-3">{SLOTS.map((s, i) => <button key={s} aria-pressed={slot === i} disabled={slotPast(i)} onClick={() => setSlot(i)} className={'soft p-3 text-sm font-semibold num ' + (slot === i ? 'sel' : '')} style={slotPast(i) ? { opacity: 0.4, cursor: 'not-allowed' } : null}>{s}</button>)}</div>
              {touched && errs.slot && <p className="text-xs mt-2" style={{ color: 'var(--danger)' }}>{errs.slot}</p>}</section>
            <section className="card p-5 grid sm:grid-cols-2 gap-4"><h3 className="font-bold sm:col-span-2">2. Tus datos</h3>
              <div className="sm:col-span-2"><label htmlFor="f-name" className="text-sm font-semibold">Nombre completo</label><input id="f-name" className="inp mt-1" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />{touched && errs.name && <p className="text-xs mt-1" style={{ color: 'var(--danger)' }}>{errs.name}</p>}</div>
              <div><label htmlFor="f-code" className="text-sm font-semibold">Código UTEC</label><input id="f-code" inputMode="numeric" className="inp mt-1 num" placeholder="202310123" value={form.ucode} onChange={(e) => setForm({ ...form, ucode: e.target.value.replace(/\D/g, '').slice(0, 9) })} />{touched && errs.ucode && <p className="text-xs mt-1" style={{ color: 'var(--danger)' }}>{errs.ucode}</p>}</div>
              <div><label htmlFor="f-phone" className="text-sm font-semibold">WhatsApp</label><input id="f-phone" inputMode="numeric" className="inp mt-1 num" placeholder="987654321" value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value.replace(/\D/g, '').slice(0, 9) })} />{touched && errs.phone && <p className="text-xs mt-1" style={{ color: 'var(--danger)' }}>{errs.phone}</p>}</div></section>
            <section className="card p-5"><h3 className="font-bold mb-3">3. Medio de pago</h3>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">{[['yape', 'Yape'], ['plin', 'Plin'], ['tarjeta', 'Tarjeta'], ['efectivo', 'Efectivo en punto']].map(([k, n]) => { const off = k === 'efectivo' && !efectivoOk; return <button key={k} disabled={off} aria-pressed={pay === k} onClick={() => setPay(k)} className={'soft p-3 text-sm font-semibold ' + (pay === k ? 'sel' : '')} style={off ? { opacity: 0.45, cursor: 'not-allowed' } : null}>{n}{off && <div className="text-[10px] muted font-normal">solo mismo día</div>}</button>; })}</div>
              {pay === 'efectivo' ? <p className="chip chip-m mt-3">Pagas al recoger. Tu plato se reserva máximo 10 minutos.</p> : <p className="text-sm muted mt-3">Simulación: no se procesa ningún pago real ni se piden datos de tarjeta.</p>}</section>
          </div>
          <aside className="card p-5 flex flex-col gap-3 lg:sticky" style={{ top: 90 }}>
            <h3 className="display text-xl font-bold">Tu pedido</h3>
            {cart.length === 0 && <p className="muted text-sm">Tu carrito está vacío.</p>}
            {cart.map((i) => <div key={i.uid} className="text-sm"><div className="flex justify-between gap-2"><span>{i.qty} × {i.name} <span className="muted text-xs">· {i.dateLabel}</span></span><b className="num">{S(unitPrice(i) * i.qty)}</b></div>{i.notes.length > 0 && <div className="text-xs muted">{i.notes.join(' · ')}</div>}{priceLines(i)}</div>)}
            {stockErrs.length > 0 && <ul className="text-xs font-semibold flex flex-col gap-1" style={{ color: 'var(--danger)' }}>{stockErrs.map((e) => <li key={e}>{e}</li>)}</ul>}
            <NutRow n={cartNut} />
            <div className="flex justify-between items-baseline pt-3" style={{ borderTop: '1px solid var(--line)' }}><span className="font-semibold">Total</span><span className="display text-3xl font-extrabold num">{S(cartTotal)}</span></div>
            <button className="btn btn-p !py-3 text-base" disabled={!cart.length} onClick={confirmOrder}>Confirmar y generar mi QR</button>
            {touched && !formOk && <p className="text-xs" style={{ color: 'var(--danger)' }}>Revisa los campos marcados.</p>}
            <button className="btn" onClick={() => setView('carta')}>← Seguir pidiendo</button>
          </aside>
        </div>
      )}
    </div>
  );

  /* ---- calculadora ---- */
  const kpi = (label, big, unit, sub) => (<div className="card p-5"><div className="lbl">{label}</div><div className="flex items-end gap-2 mt-2 num"><span className="display text-4xl font-extrabold">{big}</span><span className="muted pb-1.5 text-sm">{unit}</span></div><div className="text-xs muted mt-1">{sub}</div></div>);
  const lunchPct = lunchK > 0 ? (pt.k / lunchK) * 100 : 0;
  const cur = ING[pickId];
  const calcView = (
    <div className="pop py-8 flex flex-col gap-6">
      <div><span className="chip chip-m"><Icon n="calc" size={13} />Línea personalizada</span><h2 className="display text-3xl md:text-4xl font-extrabold mt-2">Arma tu almuerzo por macros</h2><p className="muted">Calculadora TDEE (Mifflin-St Jeor). Tu almuerzo debe aportar el 35% de tu meta del día.</p><p className="text-xs muted mt-1">Valores nutricionales estimados con fines referenciales. No reemplazan una evaluación nutricional individual.</p></div>
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
        {kpi('TMB base', r0(tmb).toLocaleString('es-PE'), 'kcal/día', 'Mifflin-St Jeor, en reposo')}
        {kpi('TDEE mantenimiento', r0(tdee).toLocaleString('es-PE'), 'kcal/día', `TMB × ${act}`)}
        {kpi('Meta calórica diaria', r0(meta).toLocaleString('es-PE'), 'kcal/día', `TDEE × (1 ${adj >= 0 ? '+' : '−'} ${Math.abs(adj)}%)`)}
        <div className="card p-5" style={{ borderColor: 'var(--pri)' }}><div className="lbl">Meta de tu almuerzo (35%) vs plato armado</div>
          <div className="flex items-end gap-2 mt-2 num"><span className="display text-4xl font-extrabold" style={{ color: 'var(--pri)' }}>{r0(pt.k)}</span><span className="muted pb-1.5 text-sm">/ {r0(lunchK)} kcal</span></div>
          <div className="bar mt-2"><i style={{ width: clamp(lunchPct, 0, 100) + '%', background: lunchPct > 108 ? 'var(--danger)' : 'var(--pri)' }} /></div><div className="text-xs muted mt-1 num">{r0(lunchPct)}% de la meta</div></div>
      </div>
      <div className="grid lg:grid-cols-[2fr_3fr] gap-5">
        <section className="card p-5 flex flex-col gap-5"><h3 className="display text-xl font-bold">Perfil biométrico</h3>
          <div><div className="lbl mb-2">Sexo</div><div className="flex gap-2" role="radiogroup" aria-label="Sexo">{[['H', 'Hombre'], ['M', 'Mujer']].map(([k, n]) => <button key={k} role="radio" aria-checked={sex === k} className={'btn flex-1 ' + (sex === k ? 'btn-p' : '')} onClick={() => setSex(k)}>{n}</button>)}</div></div>
          {[['Edad', 'c-age', age, 16, 60, 1, setAge, ' años'], ['Peso', 'c-weight', weight, 40, 140, 0.5, setWeight, ' kg'], ['Altura', 'c-height', height, 140, 210, 1, setHeight, ' cm']].map(([n, id, v, lo, hi, st, fn, u]) => (
            <div key={id}><div className="flex justify-between"><label htmlFor={id} className="lbl">{n}</label><b className="num">{id === 'c-weight' ? Number(v).toFixed(1) : v}{u}</b></div><input id={id} type="range" min={lo} max={hi} step={st} value={v} onChange={(e) => fn(Number(e.target.value))} /></div>))}
          <div><label htmlFor="c-act" className="lbl">Factor de actividad</label><select id="c-act" className="inp mt-1" value={act} onChange={(e) => setAct(Number(e.target.value))}>{ACTIVITY.map(([n, f, lab]) => <option key={f} value={f}>{n} ({lab})</option>)}</select></div>
          <div><div className="flex justify-between"><label htmlFor="c-adj" className="lbl">Objetivo calórico</label><b className="num">{adj > 0 ? '+' : ''}{adj}% <span className="muted font-normal">({adj < 0 ? 'Déficit' : adj > 0 ? 'Superávit' : 'Mantenimiento'})</span></b></div><input id="c-adj" type="range" min="-25" max="20" step="1" value={adj} onChange={(e) => setAdj(Number(e.target.value))} /><div className="flex justify-between text-[11px] muted"><span>−25% déficit</span><span>+20% superávit</span></div></div>
          <div><label htmlFor="c-mac" className="lbl">Distribución de macronutrientes</label><select id="c-mac" className="inp mt-1" value={macro} onChange={(e) => setMacro(e.target.value)}>{Object.entries(MACROS).map(([k, v]) => <option key={k} value={k}>{v.name} ({v.p}% P / {v.c}% C / {v.g}% G)</option>)}</select></div>
        </section>
        <section className="card p-5 flex flex-col gap-5"><h3 className="display text-xl font-bold">Balance y macronutrientes del almuerzo</h3>
          <div className="grid sm:grid-cols-[auto_1fr] gap-6 items-center">
            <div className="flex justify-center"><Donut p={shares.p} c={shares.c} g={shares.g} center={kM > 0 ? r0(pt.k) : r0(lunchK)} sub={kM > 0 ? 'kcal en tu plato' : 'kcal meta (sin plato)'} /></div>
            <ul className="flex flex-col gap-2 text-sm num">{[['Prot', 'var(--prot)', shares.p, dist.p, pt.p], ['Carb', 'var(--carb)', shares.c, dist.c, pt.c], ['Grasa', 'var(--fat)', shares.g, dist.g, pt.g]].map(([n, col, s, d, g]) => <li key={n} className="flex items-center gap-3"><span className="w-3 h-3 rounded-full shrink-0" style={{ background: col }} /><span className="font-semibold w-12">{n}</span><b>{r0(s)}%</b><span className="muted">meta {d}% · {r0(g)} g</span></li>)}</ul></div>
          <div className="flex flex-col gap-4"><MacroBar label="Proteínas · 4 kcal/g" color="var(--prot)" have={pt.p} goal={tgt.p} /><MacroBar label="Carbohidratos · 4 kcal/g" color="var(--carb)" have={pt.c} goal={tgt.c} /><MacroBar label="Grasas · 9 kcal/g" color="var(--fat)" have={pt.g} goal={tgt.g} /></div>
        </section>
      </div>
      <section className="card p-5 md:p-6">
        <div className="flex flex-wrap items-start justify-between gap-2"><div><h3 className="display text-xl font-bold">Armador por gramos</h3><p className="text-sm muted">Cocina aliada con balanza: eliges el ingrediente y los gramos exactos.</p></div>{example && <span className="chip chip-m">Plato de ejemplo, edítalo</span>}</div>
        <div className="flex flex-wrap gap-2 mt-4" role="tablist">{Object.entries(CATS).map(([k, v]) => <button key={k} role="tab" aria-selected={pickCat === k} className="tab" onClick={() => { setPickCat(k); setPickId(Object.values(ING).find((i) => i.cat === k).id); }}>{v.name}</button>)}</div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 mt-3">{Object.values(ING).filter((i) => i.cat === pickCat).map((i) => { const out = avail(i.id) <= 0; return <button key={i.id} disabled={out} onClick={() => setPickId(i.id)} aria-pressed={pickId === i.id} className={'soft p-2.5 text-left flex items-center gap-3 ' + (pickId === i.id ? 'sel' : '')} style={out ? { opacity: 0.5, cursor: 'not-allowed' } : null}><IngIcon k={i.id} size={44} /><div className="min-w-0"><div className="font-semibold text-sm">{i.n}{PREMIUM[i.id] && <span className="chip chip-p ml-1.5 !py-0">premium</span>}{out && <span className="chip ml-1.5 !py-0" style={{ color: 'var(--danger)' }}>Agotado</span>}</div><div className="text-xs muted num">{i.k} kcal · P {i.p} · C {i.c} · G {i.g} /100 g</div></div></button>; })}</div>
        <div className="flex flex-wrap items-end gap-3 mt-4">
          <div style={{ width: 130 }}><label htmlFor="pick-g" className="lbl">Gramos</label><input id="pick-g" type="number" min="1" max="1000" className="inp mt-1 num" value={pickG} onChange={(e) => setPickG(e.target.value)} onFocus={(e) => e.target.select()} /></div>
          <div className="text-sm muted num pb-2">{cur.n}: <b style={{ color: 'var(--fg)' }}>{r0(cur.k * (Number(pickG) || 0) / 100)} kcal</b> · {r1(cur.p * (Number(pickG) || 0) / 100)} g P</div>
          <button className="btn btn-p ml-auto" onClick={addIng}><Icon n="plus" size={16} />Agregar a mi almuerzo</button></div>
        <div className="overflow-x-auto mt-5"><table style={{ minWidth: 640 }}>
          <thead><tr><th>Ingrediente</th><th style={{ width: 110 }}>Gramos</th><th>Kcal</th><th>P</th><th>C</th><th>G</th><th style={{ width: 44 }}><span className="sr-only">Quitar</span></th></tr></thead>
          <tbody className="num">{plate.length === 0 && <tr><td colSpan="7" className="muted text-center py-6">Tu plato está vacío. Elige un ingrediente y agrégalo.</td></tr>}
            {plate.map((r) => { const i = ING[r.id], f = r.g / 100; return (<tr key={r.id}><td className="font-semibold"><span className="flex items-center gap-2"><IngIcon k={i.id} size={32} />{i.n}</span></td><td><input aria-label={`Gramos de ${i.n}`} type="number" min="0" max="1000" className="inp num" style={{ padding: '5px 8px' }} value={r.g} onChange={(e) => setGrams(r.id, e.target.value)} onFocus={(e) => e.target.select()} /></td><td>{r0(i.k * f)}</td><td>{r1(i.p * f)}</td><td>{r1(i.c * f)}</td><td>{r1(i.g * f)}</td><td><button className="btn !p-1.5" aria-label={`Quitar ${i.n}`} onClick={() => setPlate((pl) => pl.filter((x) => x.id !== r.id))}><Icon n="x" size={14} /></button></td></tr>); })}</tbody>
          {plate.length > 0 && <tfoot className="num"><tr style={{ background: 'var(--surface2)' }}><td className="font-bold">Total del plato</td><td className="font-bold">{r0(pt.grams)} g</td><td className="font-bold">{r0(pt.k)}</td><td className="font-bold">{r1(pt.p)}</td><td className="font-bold">{r1(pt.c)}</td><td className="font-bold">{r1(pt.g)}</td><td /></tr></tfoot>}</table></div>
        <div className="grid md:grid-cols-[1fr_auto] gap-5 items-end mt-5">
          <div className="text-sm num flex flex-col gap-1 max-w-sm"><div className="lbl mb-1">Precio de tu plato</div>
            <div className="flex justify-between gap-6"><span className="muted">Precio base ({MODES[mode].name.toLowerCase()})</span><span>{plate.length ? S(base) : S(0)}</span></div>
            {cp.bd.prem > 0 && <div className="flex justify-between gap-6"><span className="muted">Suplemento proteína premium</span><span>+ {S(cp.bd.prem)}</span></div>}
            {cp.lines.map(([t, v]) => <div key={t} className="flex justify-between gap-6"><span className="muted">{t}</span><span>+ {S(v)}</span></div>)}
            <div className="flex justify-between gap-6 font-bold text-lg pt-1" style={{ borderTop: '1px solid var(--line)' }}><span>Total</span><span style={{ color: 'var(--pri)' }}>{S(plate.length ? base + cp.extra : 0)}</span></div>
            <div className="text-xs muted mt-1">Incluye proteína {GSTD.prot} g, carbohidrato {GSTD.carb} g y verduras {GSTD.veg} g. Cada 50 g adicionales: pollo, huevo o tofu {S(SUP.pollo)} · pescado o res {S(SUP.premium)} (más {S(SUP.swap)} una vez por ser premium) · quinua, arroz integral o menestras {S(SUP.quinua)} · verduras {S(SUP.verduras)} · palta {S(SUP.palta)}. Máximo 150 g adicionales por grupo.</div>
            <div className="text-xs mt-1">{lunchDate(day, mode).ok ? <>Para: <b>{lunchDate(day, mode).label}</b> · {MODES[mode].name}</> : <span style={{ color: 'var(--danger)' }}>{lunchDate(day, mode).why}</span>}</div></div>
          <button className="btn btn-p !py-3" disabled={!plate.length || pt.k <= 0 || cp.missing.length > 0 || !lunchDate(day, mode).ok} onClick={addCustom}><Icon n="bag" size={16} />Agregar mi plato personalizado al carrito</button>
          {cp.missing.length > 0 && plate.length > 0 && <p className="text-xs md:col-span-2" style={{ color: 'var(--danger)' }}>Para armar tu plato elige {cp.missing.join(', ')}.</p>}
        </div>
      </section>
    </div>
  );

  return (
    <div className="min-h-screen">
      {header}
      <main className="wrap">{view === 'carta' && carta}{view === 'extras' && extrasView}{view === 'calc' && calcView}{view === 'checkout' && checkout}</main>
      <footer className="wrap pb-10 pt-4 text-xs muted">Bien Servido · Módulo Piso 1 UTEC, Lima · Los pagos y el QR son simulados.</footer>
      {dishModal}{drawerView}
      {toast && <div role="status" className="pop fixed left-1/2 -translate-x-1/2 z-[120] btn btn-p" style={{ bottom: 'max(20px, env(safe-area-inset-bottom,0px))' }}><Icon n="check" size={16} />{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
